[tool.poetry]
name = "keep-ingestion"
version = "0.52.1"
description = "Alert intake for Keep: authenticates provider webhooks and publishes to Kafka."
authors = ["Keep Alerting LTD"]
packages = [{include = "src"}]

[tool.poetry.dependencies]
# Trimmed to what alert intake needs: an HTTP server, a Kafka producer, an
# API-key lookup, and observability. Anything that exists to serve the UI, run
# migrations, or drive providers is deliberately absent -- see the block at the
# bottom of this section for what was dropped and why.
python = ">=3.11,<3.14"
# web layer
fastapi = "^0.115.6"
uvicorn = "0.32.1"
gunicorn = "^23.0.0"
python-multipart = "^0.0.18"          # form bodies on the per-provider route
starlette-context = "^0.3.6"
slowapi = "^0.1.9"                    # rate limit on the public intake route
pydantic = "^1.10.4"
# messaging
aiokafka = "^0.12.0"
# database (read-only: tenant, tenantapikey, operator)
sqlmodel = "^0.0.22"
sqlalchemy = "^2.0.14"
sqlalchemy-utils = "^0.41.0"
psycopg = "^3.2.3"
psycopg-binary = "^3.2.3"
psycopg2-binary = "^2.9.10"
cloud-sql-python-connector = "1.12.0"
# auth
PyJWT = "^2.8.0"
# config / runtime
python-dotenv = "^0.21.1"
click = "^8.1.3"
pyyaml = "^6.0"
requests = "^2.32.4"
urllib3 = "<2.4.0"
setuptools = "^75.0.0"
pytz = "^2024.1"                      # AlertDto timestamp handling
json5 = "^0.9.28"
retry2 = "^0.9.5"
# observability
python-json-logger = "^2.0.6"
prometheus-client = "^0.21.1"
prometheus-fastapi-instrumentator = "^7.0.0"
opentelemetry-sdk = "1.29.0"
opentelemetry-instrumentation-fastapi = "0.50b0"
opentelemetry-instrumentation-logging = "0.50b0"
opentelemetry-instrumentation-sqlalchemy = "0.50b0"
opentelemetry-instrumentation-requests = "0.50b0"
opentelemetry-exporter-otlp-proto-grpc = "^1.20.0"
opentelemetry-exporter-otlp-proto-http = "^1.20.0"

# Dropped from the gateway's set, with the reason each is unreachable here:
#   elasticsearch, cel-python           search/CEL -- UI query paths only
#   openai                              AI suggestions
#   arq                                 Redis job queue
#   alembic                             keep-api-gateway is the sole schema owner
#   pusher                              UI websockets
#   boto3, kubernetes,                  provider framework + secret managers,
#     google-cloud-secret-manager, hvac   reachable only via the incident-intake
#                                         route, which is deleted, not ported
#   pyngrok                             local provider tunnelling
#   pymysql                             Postgres only
#   prettytable                         CLI output
#   chevron                             templating in the BI half of /metrics
#   python-keycloak                     bearer-token identity managers
#   google-auth, pympler                unused once the above are gone

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.0.4"
pre-commit-hooks = "^4.4.0"
yamllint = "^1.29.0"
black = "^24.3.0"
isort = "^5.12.0"
autopep8 = "^2.0.1"
flake8 = "^6.0.0"
coverage = "^7.2.2"
ruff = "^0.11.4"
pytest = "^8.2.0"
pytest-xdist = "^3.6.1"
pytest-mock = "^3.11.1"
pytest-docker = "^3.1.1"
pytest-asyncio = "^0.25.0"
pytest-timeout = "^2.3.1"
docstring-parser = "^0.16"

freezegun = "^1.5.1"
jinja2 = "^3.1.6"
tenacity = "^9.1.4"
isodate = "^0.7.2"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
ignore = ["F405", "F811", "E712", "E711", "F403"]

[tool.semantic_release]
assets = []
commit_message = "{version}\n\n Released new version of the Keep"
commit_parser = "angular"
logging_use_named_masks = false
major_on_zero = true
allow_zero_version = true
tag_format = "v{version}"
version_toml = [
    "pyproject.toml:tool.poetry.version",
]

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.changelog]
template_dir = "templates"
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = []

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = false
lstrip_blocks = false
newline_sequence = "\n"
keep_trailing_newline = false
extensions = []
autoescape = true

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
default_bump_level = 0

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.pytest.ini_options]
# Timeout lives here, not as a CI-only `--timeout 60`, so a hang reproduces
# identically on a laptop and in the pipeline. keep-event-handler does the same.
timeout = 60
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning"
]
