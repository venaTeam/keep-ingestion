name: Tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      # tests/** is in the filter deliberately: the gateway's omits it, so a
      # test-only change there skips CI and merges unverified.
      - "tests/**"
      - "poetry.lock"
      - "pyproject.toml"
      - ".github/workflows/**"
  push:
    branches:
      - main
      - dev
    paths:
      - "src/**"
      # tests/** is in the filter deliberately: the gateway's omits it, so a
      # test-only change there skips CI and merges unverified.
      - "tests/**"
      - "poetry.lock"
      - "pyproject.toml"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: 3.11

jobs:
  prepare-test-environment:
    # No Elasticsearch service container: this service does not index anything.
    # Search and the ES client stay with keep-api-gateway.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: .venv
          key: pydeps-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies using poetry
        run: poetry install --no-interaction --no-root --with dev

      - name: Run unit tests and report coverage
        run: |
          poetry run coverage run --omit="*/test*" --branch -m pytest -v tests/

      - name: Convert coverage results to JSON
        run: poetry run coverage json

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          files: coverage.json
          verbose: true
